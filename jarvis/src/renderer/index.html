<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Jarvis</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Jarvis</h1>
        <button id="settingsBtn" class="icon-btn" title="Настройки">⚙</button>
      </div>
      <h2>Напоминания</h2>
      <ul id="remindersList" class="reminders-list"></ul>
    </aside>

    <main class="chat">
      <div id="messages" class="messages"></div>
      <form id="chatForm" class="chat-input">
        <textarea id="chatInput" placeholder="Напишите сообщение..." rows="2"></textarea>
        <button id="sendBtn" type="submit">Отправить</button>
      </form>
    </main>
  </div>

  <!-- Модалка подтверждения команды -->
  <div id="confirmModal" class="modal hidden">
    <div class="modal-box">
      <h3>Подтверждение выполнения команды</h3>
      <p>Jarvis хочет выполнить следующую команду на вашем компьютере:</p>
      <pre id="confirmCommand" class="command-preview"></pre>
      <p id="confirmCwd" class="cwd-preview"></p>
      <div class="modal-actions">
        <button id="confirmDeny" class="btn-secondary">Отклонить</button>
        <button id="confirmApprove" class="btn-primary">Выполнить</button>
      </div>
    </div>
  </div>

  <!-- Модалка настроек -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-box">
      <h3>Настройки</h3>
      <label for="apiKeyInput">Anthropic API-ключ</label>
      <input id="apiKeyInput" type="password" placeholder="sk-ant-..." />
      <label for="modelSelect">Модель</label>
      <select id="modelSelect">
        <option value="claude-haiku-4-5" selected>Claude Haiku 4.5 (быстрая/дешёвая)</option>
        <option value="claude-sonnet-5">Claude Sonnet 5 (баланс)</option>
        <option value="claude-opus-4-8">Claude Opus 4.8 (самая мощная)</option>
      </select>
      <div class="modal-actions">
        <button id="settingsClose" class="btn-secondary">Закрыть</button>
        <button id="settingsSave" class="btn-primary">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
