<style>
  :root{ --espresso:#3a2817; --accent:#c2703d; --line:#e7ddcd; --muted:#8a7a64; --green:#2f9e5f; --amber:#d99a3a; --red:#c14a3f; }
  body{ background:#f6f1e8; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:#2b1d12; }
  .topbar{ background:linear-gradient(90deg,#2b1d12,#4a3320); color:#f7eddc; position:sticky; top:0; z-index:30; box-shadow:0 2px 14px -6px rgba(0,0,0,.6); }
  .brand{ font-weight:800; font-size:17px; }
  .brand span{ color:#e5b98f; font-weight:600; }
  .brand .sub{ font-size:11px; color:#c9b79c; font-weight:500; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .tab{ background:transparent; color:#e8dcc7; border:none; padding:7px 13px; border-radius:9px; font-weight:600; font-size:13.5px; cursor:pointer; }
  .tab:hover{ background:rgba(255,255,255,.08); }
  .tab.active{ background:#f0b357; color:#3a2817; }
  .card{ border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 26px -20px rgba(0,0,0,.35); background:#fffdf9; }
  .card-flt{ background:#fffdf9; }
  .chart-title{ font-weight:700; margin-bottom:10px; color:#3a2817; font-size:15px; }
  .chart-title .muted{ color:var(--muted); font-weight:500; font-size:12px; }
  .chart{ width:100%; height:300px; }
  .muted{ color:var(--muted); }
  /* KPI */
  .kpi{ background:#fffdf9; border:1px solid var(--line); border-radius:14px; padding:12px 14px; height:100%; }
  .kpi .lbl{ font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
  .kpi .val{ font-size:21px; font-weight:800; line-height:1.15; margin-top:3px; }
  .kpi .sub{ font-size:11px; color:var(--muted); }
  .kpi.accent{ background:linear-gradient(135deg,#c2703d,#9d5126); color:#fff; border:none; }
  .kpi.accent .lbl,.kpi.accent .sub{ color:#f3e3d2; }
  .kpi .val.down{ color:var(--red); } .kpi .val.up{ color:var(--green); }
  /* highlight cards */
  .hl{ border-radius:14px; padding:14px 16px; height:100%; border:1px solid var(--line); }
  .hl.green{ background:#eef7f0; border-color:#cfe6d6; } .hl.blue{ background:#eef3f8; border-color:#d3e0ec; } .hl.amber{ background:#fdf6e9; border-color:#eddcbe; }
  .hl .t{ font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; }
  .hl .m{ margin-top:5px; font-size:14px; }
  /* abc cards */
  .abccard{ border-radius:12px; padding:12px; text-align:center; border:1px solid var(--line); }
  .abccard.a{ background:#eef7f0; border-color:#cfe6d6; } .abccard.b{ background:#fdf6e9; border-color:#eddcbe; } .abccard.c{ background:#fbeeec; border-color:#eccfc9; }
  .abccard .g{ font-size:20px; font-weight:800; } .abccard.a .g{ color:var(--green);} .abccard.b .g{ color:var(--amber);} .abccard.c .g{ color:var(--red);}
  .abccard .n{ font-size:16px; font-weight:800; } .abccard .s{ font-size:11px; color:var(--muted); }
  .txt-a{ color:var(--green);} .txt-b{ color:var(--amber);} .txt-c{ color:var(--red);}
  .badge-abc{ display:inline-block; width:22px; height:22px; line-height:22px; border-radius:50%; text-align:center; font-weight:800; font-size:12px; color:#fff; }
  .badge-abc.A{ background:var(--green);} .badge-abc.B{ background:var(--amber);} .badge-abc.C{ background:var(--red);}
  table.tbl{ width:100%; font-size:13px; } table.tbl th{ color:var(--muted); font-weight:700; font-size:11px; text-transform:uppercase; border-bottom:2px solid var(--line); padding:8px 6px; }
  table.tbl td{ padding:8px 6px; border-bottom:1px solid #f0e9dc; } table.tbl tr:hover td{ background:#faf5ea; }
  .prog{ height:8px; background:#eee3d0; border-radius:6px; overflow:hidden; } .prog>i{ display:block; height:100%; background:var(--green); }
  .rec{ border-radius:12px; padding:12px 14px; font-size:13px; height:100%; } .rec b{ display:block; margin-bottom:4px; }
  .rec-a{ background:#eef7f0;} .rec-b{ background:#fdf6e9;} .rec-c{ background:#fbeeec;}
  .listrow{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid #f0e9dc; font-size:13.5px; }
  .listrow b{ color:#8a4b22; }
  .insights{ font-size:14px; line-height:1.7; } .insights b{ color:#8a4b22; }
  @media (max-width:576px){ .chart{ height:260px; } .kpi .val{ font-size:18px; } .brand{ font-size:15px; } }
  /* password gate */
  #gate{ position:fixed; inset:0; background:linear-gradient(135deg,#2b1d12,#4a3320); display:flex; align-items:center; justify-content:center; z-index:100; }
  .gate-box{ background:#fffdf9; border-radius:18px; padding:28px 26px; width:320px; max-width:92vw; box-shadow:0 30px 80px -30px rgba(0,0,0,.6); text-align:center; }
  .gate-logo{ font-weight:800; color:#8a4b22; font-size:18px; }
  .gate-title{ font-weight:800; font-size:20px; margin-top:6px; }
  .gate-sub{ color:#8a7a64; font-size:13px; margin-top:2px; }
  .gate-err{ color:#c14a3f; font-size:13px; margin-top:8px; min-height:18px; }
</style>
