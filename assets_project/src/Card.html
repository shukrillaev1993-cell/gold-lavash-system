<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartochka OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f4f8;padding:12px}
.wrap{max-width:820px;margin:0 auto}
.pbar{background:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;border:1px solid #e2e8f0}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;text-decoration:none;display:inline-block}
.bp{background:#1a3a5c;color:#fff}
.bo{background:transparent;color:#1a3a5c;border:1.5px solid #cbd5e0}
.err{background:#fff5f5;border:2px solid #e53e3e;border-radius:12px;padding:28px;text-align:center;color:#c53030;margin:20px 0}
.card{background:#fff;border:2px solid #1a3a5c;border-radius:10px;overflow:hidden;margin-bottom:14px}
.ch{background:#1a3a5c;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.ch .br{font-size:12px;font-weight:700}
.ch .iv{font-size:15px;font-weight:800;color:#d4a017}
.cb{display:grid;grid-template-columns:130px 1fr}
.cq{padding:12px;border-right:1.5px solid #e2e8f0;display:flex;flex-direction:column;align-items:center;gap:5px}
.cq img{width:108px;height:108px;border-radius:6px}
.cql{font-size:9px;color:#718096;text-align:center}
.ci{padding:12px 14px}
.cn{font-size:13px;font-weight:700;color:#1a3a5c;line-height:1.3;margin-bottom:8px}
.cf{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
.fl{font-size:9px;font-weight:600;color:#718096;text-transform:uppercase;letter-spacing:.4px}
.fv{font-size:11px;font-weight:600;color:#1a2332}
.cf2{background:#f7f9fc;border-top:1.5px solid #e2e8f0;padding:7px 14px;display:flex;justify-content:space-between}
.det{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;margin-bottom:12px}
.dh{background:#1a3a5c;color:#fff;padding:16px 20px}
.di{font-size:12px;color:#d4a017;font-weight:700}
.dn{font-size:16px;font-weight:800;margin-top:3px;line-height:1.3}
.dd{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}
.db{display:grid;grid-template-columns:190px 1fr}
.dpc{padding:16px;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;gap:8px;align-items:center}
.dpc img{width:130px;height:130px;border-radius:8px}
.ph{width:160px;height:160px;background:#f7f9fc;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#a0aec0;border:1px dashed #e2e8f0}
.dic{padding:16px}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.il{font-size:10px;color:#718096;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.ival{font-size:13px;color:#1a2332;font-weight:500;margin-top:2px}
.ld{text-align:center;padding:40px;color:#718096;font-size:14px}
@media print{
  body{background:#fff;padding:0}
  .pbar,.det{display:none}
  .card{box-shadow:none}
  @page{size:A5 landscape;margin:6mm}
}
@media(max-width:600px){
  .cb,.db,.ig,.cf{grid-template-columns:1fr}
  .cq,.dpc{border-right:none;border-bottom:1px solid #e2e8f0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="pbar">
    <button class="btn bp" onclick="window.print()">Print A5</button>
    <button class="btn bo" onclick="history.back()">Back</button>
  </div>
  <div id="ct"><div class="ld">Loading...</div></div>
</div>
<script>
function g(n){return new URLSearchParams(window.location.search).get(n)||''}
function fn(n){return (parseFloat(n)||0).toLocaleString('ru-RU',{maximumFractionDigits:0})+' sum'}
function fp(n){return ((parseFloat(n)||0)*100).toFixed(0)+'%'}
var inv=g('inv');
if(!inv){
  document.getElementById('ct').innerHTML='<div class="err"><b>Inv number not in URL</b></div>';
}else{
  google.script.run
    .withSuccessHandler(function(os){
      if(!os){document.getElementById('ct').innerHTML='<div class="err"><b>Not found: '+inv+'</b></div>';return;}
      var u=window.location.href;
      var qr='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(u);
      var cost=parseFloat(os['Rynochny stoimost']||os['\u0420\u044b\u043d\u043e\u0447\u043d\u044b\u0439 \u0441\u0442\u043e\u0438\u043c\u043e\u0441\u0442\u044c'])||0;
      var name=os['\u041d\u0430\u0438\u043c\u0435\u043d\u043e\u0432\u0430\u043d\u0438\u0435']||'';
      var resp=os['\u041e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0439 \u043b\u0438\u0446\u043e']||'-';
      var dept=os['\u041f\u043e\u0434\u0440\u0430\u0437\u0434\u0435\u043b\u0435\u043d\u0438\u044f']||'';
      var addr=os['\u0410\u0434\u0440\u0435\u0441']||'-';
      var date=os['\u0414\u0430\u0442\u0430 \u043f\u043e\u0441\u0442\u0443\u043f\u043b\u0435\u043d\u0438\u0435']||'-';
      var pct=parseFloat(os['\u0410\u043c\u043e\u0440\u0442\u0438\u0437\u0430\u0446\u0438\u044f %'])||0;
      var state=os['\u0421\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u044f']||'';
      var vid=os['\u0412\u0438\u0434']||'-';
      var type=os['\u041e\u0421/\u0418\u043d\u0432\u0435\u043d\u0442\u0430\u0440']||'';
      var life=os['\u041f\u043e\u043b\u0435\u0437\u043d\u044b\u0439 \u0441\u0440\u043e\u043a \u0441\u043b\u0443\u0436\u0431\u044b']||'-';
      var ct=document.getElementById('ct');
      ct.innerHTML='';
      var d=document;
      
      // Build card using DOM - no string quotes issues
      function el(tag,cls,txt){var e=d.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e;}
      function div(cls,txt){return el('div',cls,txt);}
      
      // Print card
      var card=div('card');
      var ch=div('ch');
      var br=div('br');br.textContent='GOLD LAVASH - Kartochka OS';
      var ivn=div('iv');ivn.textContent=inv;
      ch.appendChild(br);ch.appendChild(ivn);card.appendChild(ch);
      
      var cb=div('cb');
      var cq=div('cq');
      var qi=d.createElement('img');qi.src=qr;qi.alt='QR';
      cq.appendChild(qi);
      cq.appendChild(div('cql','Scan to view'));
      cb.appendChild(cq);
      
      var ci=div('ci');
      ci.appendChild(div('cn',name));
      var cf=div('cf');
      var fields=[['Resp',resp],['Date',date],['Cost',fn(cost)],['Amort',fp(pct)+'/yr'],['State',state],['Vid',vid],['Addr',addr],['Life',life+' y']];
      fields.forEach(function(f){var fi=div('');var fl=div('fl',f[0]);var fv=div('fv',f[1]);fi.appendChild(fl);fi.appendChild(fv);cf.appendChild(fi);});
      ci.appendChild(cf);
      cb.appendChild(ci);
      card.appendChild(cb);
      
      var cf2=div('cf2');
      var dl=div('');dl.textContent=dept+' - '+type;dl.style.fontSize='11px';dl.style.fontWeight='700';dl.style.color='#1a3a5c';
      var st=div('');st.textContent=state;st.style.fontSize='11px';st.style.fontWeight='600';st.style.color='#38a169';
      cf2.appendChild(dl);cf2.appendChild(st);
      card.appendChild(cf2);
      ct.appendChild(card);
      
      // Detail card
      var det=div('det');
      var dh=div('dh');
      dh.appendChild(div('di',inv));
      dh.appendChild(div('dn',name));
      dh.appendChild(div('dd',dept+' - '+type+' - '+vid));
      det.appendChild(dh);
      
      var db=div('db');
      var dpc=div('dpc');
      var photo=os['Foto URL']||os['\u0424\u043e\u0442\u043e URL']||'';
      if(photo&&photo.indexOf('http')===0){var pi=d.createElement('img');pi.src=photo;pi.style.cssText='width:150px;height:150px;object-fit:cover;border-radius:9px';dpc.appendChild(pi);}
      else{dpc.appendChild(div('ph','No photo'));}
      var qi2=d.createElement('img');qi2.src=qr;qi2.className='';qi2.style.cssText='width:128px;height:128px;border-radius:8px';
      dpc.appendChild(qi2);
      db.appendChild(dpc);
      
      var dic=div('dic');
      var ig=div('ig');
      var info=[['Inv',inv],['Type',type],['Vid',vid],['Dept',dept],['Resp',resp],['Addr',addr],['Date',date],['Life',life],['Cost',fn(cost)],['Amort',fp(pct)+'/yr'],['State',state]];
      info.forEach(function(f){var fi=div('');fi.appendChild(div('il',f[0]));fi.appendChild(div('ival',f[1]));ig.appendChild(fi);});
      dic.appendChild(ig);
      db.appendChild(dic);
      det.appendChild(db);
      ct.appendChild(det);
    })
    .withFailureHandler(function(e){
      document.getElementById('ct').innerHTML='<div class="err">Error: '+e+'</div>';
    })
    .getOSByInvPublic(inv);
}
</script>
</body>
</html>
